apiVersion: v1
kind: ConfigMap
metadata:
  name: openmotion-config
  namespace: openmotion
  labels:
    app.kubernetes.io/name: openmotion-config
    app.kubernetes.io/part-of: openmotion
# Every key below matches src/infra/config.ts verbatim.
data:
  # Core service
  NODE_ENV: "production"
  APP_PUBLIC_ORIGIN: "https://motion.example.com"
  PORT: "4173"
  BIND_HOST: "0.0.0.0"
  LOG_LEVEL: "info"

  # Database & Redis
  PG_POOL_MAX: "20"
  REDIS_CACHE_TTL_SEC: "3600"

  # Object storage (S3 / Cloudflare R2 / RustFS / MinIO)
  S3_ENDPOINT: "https://s3.example.com"
  S3_PUBLIC_ENDPOINT: "https://s3.example.com"
  S3_REGION: "auto"
  S3_BUCKET: "openmotion"
  S3_FORCE_PATH_STYLE: "false"
  S3_PRESIGN_PUT_TTL_SEC: "900"
  S3_PRESIGN_GET_TTL_SEC: "300"

  # Auth & OIDC (production strictly requires AUTH_MODE=oidc)
  AUTH_MODE: "oidc"
  ALLOW_INSECURE_DEV_AUTH: "false"
  TRUST_PROXY_HOPS: "1"
  OIDC_ISSUER: "https://auth.example.com"
  OIDC_CLIENT_ID: "openmotion-web"
  OIDC_CALLBACK_URL: "https://motion.example.com/api/auth/callback"
  OIDC_SCOPES: "openid profile email"
  OIDC_CLAIM_SUB: "sub"
  OIDC_CLAIM_EMAIL: "email"
  OIDC_CLAIM_NAME: "name"
  OIDC_CLAIM_WORKSPACE: "workspace_id"

  # Remote MCP OAuth 2.1 & body limit (10 MiB)
  MCP_OAUTH_MODE: "proxy"
  MCP_OAUTH_ISSUER: "https://motion.example.com"
  MCP_MAX_BODY_BYTES: "10485760"

  # Unified OpenDesign Model Gateway
  MODEL_GATEWAY_MODE: "opendesign"
  OPENDESIGN_API_URL: "https://amr-api.open-design.ai"
  OPENDESIGN_LINK_URL: "https://amr-link.open-design.ai"
  OPENDESIGN_BILLING_SYNC_ENABLED: "false"
  ALLOW_DOH_FAKEIP_FALLBACK: "false"

  # Worker concurrency & CAS GC tuning
  MEDIA_CONCURRENCY: "20"
  RENDER_CONCURRENCY: "1"
  BLOB_GC_GRACE_SECONDS: "86400"
